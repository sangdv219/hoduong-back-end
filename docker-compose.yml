networks:
  demo:
    driver: bridge
services:
  # migrate:
  #   build: .
  #   environment:
  #     - NODE_ENV=staging
  #   image: sangdev2109/hoduong-migrate:latest
  #   command: npx sequelize-cli db:migrate --config dist/config/config.json --env ${NODE_ENV} 
  #   container_name: migrate
