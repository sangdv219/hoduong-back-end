  #       condition: service_healthy
  #   networks:
  #     - demo
  app:
    build: .
    image: sangdev2109/hoduong-backend-app:latest
    container_name: hoduong-backend-app
    env_file:
      - .env.staging
   
    ports: 
      - "3000:3000"
    restart: on-failure
    depends_on:
      - postgres
      - redis
    networks:
      - demo
 
  postgres:
    image: postgres:17
    networks:
      - demo
    container_name: postgres
    restart: on-failure
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sangduong
      DB_DATABASE: hoduong
      DB_PASSWORD: 210919
      DB_HOST: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangduong -d hoduong"]
      interval: 10s
      timeout: 5s
      # retries: 5


  redis:
    image: redis/redis-stack
    container_name: redis
    networks:
      - demo
    ports:
      - "6379:6379"
    restart: on-failure
    volumes:
      - redis_data:/data

  
volumes:
  postgres_data: null 
  pgadmin_data: null
  redis_data: null

